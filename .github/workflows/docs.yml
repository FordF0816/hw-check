name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two deployments pushing to gh-pages at the same time overwrite each other.
# Keep one at a time; a newer commit cancels an older build.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install mkdocs mkdocs-material
      - run: mkdocs gh-deploy --force
